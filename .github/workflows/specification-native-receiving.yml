name: Specification Engineering native source and package receiving

on:
  # A merged source cut must receive its own source-qualified job on main;
  # pull-request CI alone is not a post-integration acceptance receipt.
  push:
    branches: [main]
    paths:
      - ".github/workflows/specification-native-receiving.yml"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "data/records/**"
      - "content/text/documents/specifications/**"
  pull_request:
    paths:
      - ".github/workflows/specification-native-receiving.yml"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "data/records/**"
      - "content/text/documents/specifications/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specification-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Clean-install committed dependency closure from original registry
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.561.group/
      - name: Run every original native Node test
        run: npm test
      - name: Read exact original pre-index source without reauthoring a benchmark provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/specification-engineering-services-section
          ref: 7ef4ddb74880d4d28a80996a87583471fedbc911
          path: baseline-original
          persist-credentials: false
      - name: Measure same-job original versus indexed native source and preserve refusals
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline-original rev-parse HEAD)" = "7ef4ddb74880d4d28a80996a87583471fedbc911"
          test "$(git hash-object baseline-original/src/architecture-description.mjs)" = "a0dbe86c7f42b7b3cf4ce4f9af533e2ac1fc188d"
          SPEC_ARCHITECTURE_BASELINE_MODULE="$GITHUB_WORKSPACE/baseline-original/src/architecture-description.mjs" \
            node --test test/architecture-description.test.mjs
      - name: Receive original normative identity counterexample against exact historical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object baseline-original/src/specification.mjs)" = "d848988d885b1387bf0d2c98aecfd2a793ee5c8b"
          SPEC_NORMATIVE_BASELINE_MODULE="$GITHUB_WORKSPACE/baseline-original/src/specification.mjs" \
            node --test test/specification.test.mjs
      - name: Qualify packed source and both runtime schemas
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/specification-pack.json"
          tarball="$(node -e 'const p=require(process.argv[1]); if(p.length!==1 || typeof p[0]?.filename!=="string")process.exit(2); process.stdout.write(p[0].filename)' "$RUNNER_TEMP/specification-pack.json")"
          # The candidate used by the clean-room consumer must have an
          # independently reproduced, byte-identical npm archive. This is
          # a source/build receipt, not a SLSA signature or publication.
          mkdir -p "$RUNNER_TEMP/specification-repack" "$RUNNER_TEMP/specification-candidate"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/specification-repack" > "$RUNNER_TEMP/specification-repack.json"
          test -f "$RUNNER_TEMP/specification-repack/$tarball"
          cmp "$RUNNER_TEMP/$tarball" "$RUNNER_TEMP/specification-repack/$tarball"
          cp "$RUNNER_TEMP/$tarball" "$RUNNER_TEMP/specification-candidate/$tarball"
          (cd "$RUNNER_TEMP/specification-candidate" && sha256sum "$tarball" > SHA256SUMS && sha256sum --check SHA256SUMS)
          # Preserve only the exact package that the separate consumer installs.
          tar -tzf "$RUNNER_TEMP/$tarball" > "$RUNNER_TEMP/specification-members.txt"
          grep -Fx 'package/data/records/schema/specification.schema.json' "$RUNNER_TEMP/specification-members.txt"
          grep -Fx 'package/data/records/schema/architecture-description.schema.json' "$RUNNER_TEMP/specification-members.txt"
          grep -Fx 'package/scripts/read-source-json-stdin.mjs' "$RUNNER_TEMP/specification-members.txt"
          test "$(grep -Fc 'package/data/records/schema/' "$RUNNER_TEMP/specification-members.txt")" -ge 2
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/ "$RUNNER_TEMP/$tarball"
          node node_modules/@red-cup-engineering/specification-engineering-services-section/scripts/render-architecture-description.mjs --help >/dev/null
          node --input-type=module -e '
            import {loadArchitectureDescriptionSchema} from "@red-cup-engineering/specification-engineering-services-section/architecture-description";
            const schema=loadArchitectureDescriptionSchema();
            if(schema?.$schema!=="https://json-schema.org/draft/2020-12/schema"
               || schema?.title?.includes("NOT a 42010:2022 conformance certificate")!==true) process.exit(2);
          '

          # The actual separately installed candidate, not the repository
          # checkout, must preserve the original customer's normative claim.
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import {
            validateSpecificationRecord, renderSpecificationMarkdown,
            deriveSpecificationFromRequirementReview,
          } from "@red-cup-engineering/specification-engineering-services-section/specification";
          import { renderSpecificationRfcXml } from "@red-cup-engineering/specification-engineering-services-section/specification-rfcxml";
          const valid = {
            identity: { id: "original-receiving", title: "Original receiving",
              seat: "source-owner", carrier: "original-receiving.md",
              "date-created": "2026-10-24", authors: ["original-author"],
              version: "0.1.0", stability: "draft", status: "draft" },
            whatThisIs: "Original receiving. {{clause:customer-acceptance}}",
            topics: [{ heading: "Receiving",
              body: "{{clause:customer-acceptance}}",
              clauses: [{ id: "customer-acceptance", actor: "The original recipient",
                keyword: "MUST", statement: "record an independent acceptance",
                backedBy: ["original admitted customer source"] }] }],
            implementations: [], openQuestions: [], laws: [], standards: [],
            provenance: { derivedFrom: ["original accepted input"],
              derivedAt: "2026-10-24T00:00:00Z", derivedBy: "source-admitted-author" },
          };
          assert.equal(validateSpecificationRecord(valid).valid, true);
          assert.match(renderSpecificationMarkdown(valid),
            /recipient MUST.*record an independent acceptance/u);
          const conflicted = structuredClone(valid);
          conflicted.topics.push({ heading: "External unadopted claimant",
            body: "{{clause:customer-acceptance}}",
            clauses: [{ id: "customer-acceptance", actor: "Unadopted claimant",
              keyword: "MUST NOT", statement: "retain original acceptance evidence",
              backedBy: ["not authorized by customer"] }] });
          assert.equal(validateSpecificationRecord(conflicted).valid, false);
          assert.throws(() => renderSpecificationMarkdown(conflicted), /declared twice/u);
          assert.throws(() => renderSpecificationRfcXml(conflicted), /declared twice/u);
          for (const name of ["render-specification", "render-specification-rfcxml"]) {
            const cmd = "node_modules/@red-cup-engineering/specification-engineering-services-section/scripts/" + name + ".mjs";
            const result = spawnSync(process.execPath, [cmd], {
              input: JSON.stringify(conflicted), encoding: "utf8", timeout: 15_000,
            });
            assert.equal(result.status, 1, result.stderr);
            assert.equal(result.stdout, "");
            assert.match(result.stderr, /unique-source-id/u);
          }
          // This is the exact independently INSTALLED package, not a
          // source-import test or a fabricated customer acceptance. The
          // original Requirement is preserved; every BCP14 reading is an
          // explicit, separately unadmitted reviewer choice.
          const requirement = {kind: "requirement",id: "buyer-work-continuity",
            "met-when": [
              {cell:"buyer-work-continuity:original-work",target:"held",
                says:"retain the original submitted customer Work identity"},
              {cell:"buyer-work-continuity:independent-recipient",target:"held",
                says:"independently receive a useful buyer outcome, not a provider claim"},
            ],
          };
          const review = {
            identity:{id:"buyer-work-continuity-spec",title:"Buyer Work continuity",
              seat:"review-only-office",carrier:"candidate/work.md",
              authors:["attributed candidate reviewer"]},
            reviewedBy:"attributed candidate reviewer",at:"2026-10-24T00:00:00Z",
            interpretations:[
              {cell:"buyer-work-continuity:original-work",clauseId:"original-work",
                keyword:"MUST",actor:"The Group"},
              {cell:"buyer-work-continuity:independent-recipient",
                clauseId:"independent-recipient",keyword:"MUST",
                actor:"The Group"},
            ],
          };
          const candidate = deriveSpecificationFromRequirementReview(requirement,review);
          assert.equal(validateSpecificationRecord(candidate).valid,true);
          assert.equal(candidate.identity.stability,"draft");
          // The ORIGINAL generator has intentionally returned an unadmitted
          // draft since its source-bound review contract was established.
          // An old CI expectation of "requires-independent" was false and
          // also broke main's packed receiving despite all native tests passing.
          assert.equal(candidate.identity.status,"draft",
            "a reviewed source correspondence is not adopted, proved or received");
          assert.deepEqual(candidate.topics[0].clauses.map(c=>c.statement),
            requirement["met-when"].map(c=>c.says));
          assert.match(renderSpecificationMarkdown(candidate),/Group MUST/u);
          assert.throws(()=>deriveSpecificationFromRequirementReview(requirement,{
            ...review, interpretations:review.interpretations.slice(1),
          }),/every source condition requires exactly one/u);
          // The source-authority rule must hold for the actual independently
          // INSTALLED package, not just generator-authored tests in the checkout.
          // This additional retention demand is explicitly an agent inference,
          // NOT a Leader/customer Requirement and NOT a normative clause.
          const withAgentInference=structuredClone(requirement);
          withAgentInference["met-when"].push({
            cell:"buyer-work-continuity:guessed-retention",target:"held",
            says:"retain every buyer record for ten years",
            inference:true,
            "leader-words":"the customer made no ten-year retention request",
          });
          const readWithInference=deriveSpecificationFromRequirementReview(
            withAgentInference,review);
          assert.equal(validateSpecificationRecord(readWithInference).valid,true);
          assert.deepEqual(readWithInference.topics[0].clauses.map(c=>c.id),
            ["original-work","independent-recipient"],
            "only independently reviewed non-inference source conditions become normative");
          assert.deepEqual(readWithInference.topics[0].clauses.map(c=>c.statement),
            requirement["met-when"].map(c=>c.says),
            "the original buyer clauses remain intact and in their source order");
          assert.equal(readWithInference.openQuestions.length,1);
          assert.match(readWithInference.openQuestions[0].question,
            /Agent inference, not stated by the Leader/u);
          assert.match(readWithInference.openQuestions[0].question,
            /retain every buyer record for ten years/u);
          assert.match(readWithInference.openQuestions[0].question,
            /buyer-work-continuity:guessed-retention/u);
          assert.match(readWithInference.openQuestions[0].question,
            /the customer made no ten-year retention request/u);
          assert.match(readWithInference.openQuestions[0].blockedBy,
            /Leader acceptance or striking/u);
          assert.equal(readWithInference.identity.status,"draft");
          assert.notEqual(readWithInference.provenance.derivedFrom[0],
            candidate.provenance.derivedFrom[0],
            "the added open inference still changes original source identity");
          assert.doesNotMatch(renderSpecificationMarkdown(readWithInference),
            /Group MUST retain every buyer record for ten years/u,
            "an unadopted inference cannot render as a normative clause");
          const forgedReview=structuredClone(review);
          forgedReview.interpretations.push({
            cell:"buyer-work-continuity:guessed-retention",
            clauseId:"guessed-retention",keyword:"MUST",actor:"Unadopted agent",
          });
          assert.throws(()=>deriveSpecificationFromRequirementReview(
            withAgentInference,forgedReview),
            /an interpretation names inference cell buyer-work-continuity:guessed-retention/u);
          const onlyInferences=structuredClone(withAgentInference);
          for(const condition of onlyInferences["met-when"])
            condition.inference=true;
          assert.throws(()=>deriveSpecificationFromRequirementReview(
            onlyInferences,{...review,interpretations:[]}),
            /nothing normative remains to specify/u,
            "a source with no customer conditions cannot create a Specification");
          const revised=structuredClone(requirement);
          revised["met-when"][0].says="retain one NEW source obligation";
          const subsequent=deriveSpecificationFromRequirementReview(revised,review);
          assert.notEqual(candidate.provenance.derivedFrom[0],
            subsequent.provenance.derivedFrom[0]);
          assert.equal(subsequent.identity.stability,"draft",
            "new input does not self-authorize an approved Specification");
          // Architecture metadata alone can pass while its referenced Work
          // has changed. Run the original source-cut reader on the same
          // independently INSTALLED package, not the build checkout.
          const { artifactId } = await import("@red-cup-engineering/semiotic-eavt-services-section/identity");
          const {
            validateArchitectureDescriptionAgainstSourceCut,
            renderArchitectureDescriptionFromSourceCut,
            readRequirementArchitectureTrace,
          } = await import("@red-cup-engineering/specification-engineering-services-section/architecture-description");
          const sourceBoundArchitecture = {
            type:"ArchitectureDescriptionCandidate",version:1,
            identity:{id:"source-cut-architecture",title:"Bounded audit architecture",
              revision:"candidate-1",owner:"source-review-office",status:"candidate"},
            standard:{designation:"ISO/IEC/IEEE 42010",edition:"2022",
              applicability:"candidate architecture-description profile",conformance:"unassessed"},
            system:{name:"Audited Work receiver",
              description:"An original customer source preserved through specification",
              sourceIds:["req","spec"]},
            upstream:{requirementsSourceId:"req",specificationSourceId:"spec"},
            sources:[
              {id:"req",locator:"urn:original:requirement",revision:artifactId(requirement)},
              {id:"spec",locator:"urn:original:specification",revision:artifactId(candidate)},
              {id:"decision",locator:"urn:original:authored-decision",revision:"candidate"},
            ],
            stakeholders:[{id:"buyer",name:"Original beneficiary",concernIds:["rights"]}],
            concerns:[{id:"rights",statement:"Preserve customer authority",
              sourceIds:["req","spec"],
              requirementCellIds:["buyer-work-continuity:original-work"],
              specificationClauseIds:["original-work"]}],
            viewpoints:[{id:"boundary",name:"Source ownership",concernIds:["rights"],
              modelKinds:["interface"],method:"Original authored interface"}],
            views:[{id:"source-view",name:"Bounded original source",
              viewpointId:"boundary",modelIds:["source-model"],sourceIds:["req","spec"]}],
            models:[{id:"source-model",kind:"interface",
              content:"Original customer source precedes every effect",
              concernIds:["rights"],sourceIds:["spec"]}],
            correspondences:[],
            decisions:[{id:"decision-1",statement:"Do not self-authorize",
              rationale:"Source citation is not original Work permission",
              alternatives:["Self-authorize","Refuse missing authority"],
              concernIds:["rights"],sourceIds:["decision"]}],
            openQuestions:[],
          };
          const cut={requirement,specification:candidate};
          const verified=validateArchitectureDescriptionAgainstSourceCut(sourceBoundArchitecture,cut);
          assert.equal(verified.valid,true,JSON.stringify(verified.issues));
          assert.match(renderArchitectureDescriptionFromSourceCut(sourceBoundArchitecture,cut),
            /conformance unassessed/u);
          const traced=readRequirementArchitectureTrace(sourceBoundArchitecture,cut);
          assert.equal(traced.counts.sourceCells,2);
          assert.equal(traced.counts.authoredModelMapped,1);
          assert.equal(traced.counts.untraced,1);
          assert.equal(traced.rows.find(row=>row.cell.endsWith(":independent-recipient")).standing,
            "normative-but-architecture-untraced");
          assert.match(renderArchitectureDescriptionFromSourceCut(sourceBoundArchitecture,cut),
            /Exact original Requirement-to-model traceability/u);
          console.log("Packed buyer condition->Specification clause->architecture model: 1 mapped, 1 untraced; no fabricated proof");
          assert.equal(validateArchitectureDescriptionAgainstSourceCut(sourceBoundArchitecture,{
            requirement:revised,specification:subsequent,
          }).valid,false,"an old Architecture source cut may not silently follow a changed Requirement");
          console.log("Packed Requirement->Specification->Architecture: source-bound candidate received; stale source refused");
          // The ACTUAL installed consumer receives the generator, not a
          // synthetic source-only assertion that an exported function exists.
          const {deriveArchitectureDescriptionFromSpecificationReview}=await import(
            "@red-cup-engineering/specification-engineering-services-section/architecture-description");
          const originalReview={
            identity:{
              id:sourceBoundArchitecture.identity.id,
              title:sourceBoundArchitecture.identity.title,
              owner:sourceBoundArchitecture.identity.owner,
            },
            sourceCut:{requirementRevision:artifactId(requirement),
              specificationRevision:artifactId(candidate)},
            applicability:sourceBoundArchitecture.standard.applicability,
            system:{name:sourceBoundArchitecture.system.name,
              description:sourceBoundArchitecture.system.description},
            supportingSources:sourceBoundArchitecture.sources.filter(row=>
              !["req","spec"].includes(row.id)),
            stakeholders:sourceBoundArchitecture.stakeholders,
            concerns:sourceBoundArchitecture.concerns,
            viewpoints:sourceBoundArchitecture.viewpoints,
            views:sourceBoundArchitecture.views,
            models:sourceBoundArchitecture.models,
            correspondences:sourceBoundArchitecture.correspondences,
            decisions:sourceBoundArchitecture.decisions,
            openQuestions:sourceBoundArchitecture.openQuestions,
          };
          const generated=deriveArchitectureDescriptionFromSpecificationReview({
            requirement,specification:candidate,review:originalReview,
          });
          assert.equal(validateArchitectureDescriptionAgainstSourceCut(generated,cut).valid,true);
          assert.deepEqual(readRequirementArchitectureTrace(generated,cut).counts,
            {sourceCells:2,authoredModelMapped:1,untraced:1});
          assert.equal(generated.standard.conformance,"unassessed");
          assert.equal(generated.identity.status,"candidate");
          const actualCmd=spawnSync(process.execPath,[
            "node_modules/@red-cup-engineering/specification-engineering-services-section/scripts/render-architecture-description.mjs",
            "--reviewed-source-cut"],{
              input:JSON.stringify({requirement,specification:candidate,review:originalReview}),
              encoding:"utf8",timeout:15000,maxBuffer:1024*1024,
            });
          assert.equal(actualCmd.status,0,actualCmd.stderr);
          assert.equal(actualCmd.stdout,renderArchitectureDescriptionFromSourceCut(generated,cut));
          const invalidOriginalReview=structuredClone(originalReview);
          invalidOriginalReview.decisions[0].sourceIds=["req"];
          assert.throws(()=>deriveArchitectureDescriptionFromSpecificationReview({
            requirement,specification:candidate,review:invalidOriginalReview,
          }),/every authored decision needs its own source/u);
          const invalidCmd=spawnSync(process.execPath,[
            "node_modules/@red-cup-engineering/specification-engineering-services-section/scripts/render-architecture-description.mjs",
            "--reviewed-source-cut"],{
              input:JSON.stringify({requirement,specification:candidate,review:invalidOriginalReview}),
              encoding:"utf8",timeout:15000,maxBuffer:1024*1024,
            });
          assert.equal(invalidCmd.status,1);
          assert.equal(invalidCmd.stdout,"","no partial design on an invalid review");
          console.log("Packed source-reviewed Specification to generated Architecture: source-cut qualified, CLI received; unauthored choice refused, Proof and buyer acceptance open.");

          console.log("Independently installed source->Specification consumer: all original conditions retained; revision re-addressed; independent admission still required");
          // Reuse the original actual packed-consumer scenario for a second
          // source-trust boundary: typed metadata must not become carrier keys.
          const special = structuredClone(valid);
          special.identity.title = "An \"original\" receipt";
          special.identity.authors = ["First, Author"];
          special.identity.status = "on";
          special.identity.seat = "Red Cup: Engineering";
          const specialLines = renderSpecificationMarkdown(special).split("\n");
          assert.ok(specialLines.includes("title: " + JSON.stringify(special.identity.title)));
          assert.ok(specialLines.includes("authors: [\"First, Author\"]"));
          assert.ok(specialLines.includes("status: \"on\""));
          assert.ok(specialLines.includes("part-of: \"Red Cup: Engineering\""));
          const forgedMetadata = structuredClone(valid);
          forgedMetadata.identity.title = "Original\nstatus: accepted";
          assert.equal(validateSpecificationRecord(forgedMetadata).valid, true);
          assert.throws(() => renderSpecificationMarkdown(forgedMetadata),
            /identity.title must be one control-free line/u);
          const forgedSection = structuredClone(valid);
          forgedSection.topics[0].heading = "Original\n## Customer accepted";
          assert.throws(() => renderSpecificationMarkdown(forgedSection),
            /topics.heading must be one control-free line/u);
          console.log("Independently installed Specification consumer: valid original preserved; conflicting source refuses in both renderers and both CLIs");
          NODE

          # Receive the new HLD/LLD contract through the actual separately
          # installed npm artifact, not the checkout's ../src imports.
          cp "$GITHUB_WORKSPACE/test/engineering-design-source-cut.fixture.mjs" "$RUNNER_TEMP/consumer/"
          cp "$GITHUB_WORKSPACE/test/engineering-design-packed-consumer.mjs" "$RUNNER_TEMP/consumer/"
          node engineering-design-packed-consumer.mjs
          # The same independently installed original package must assess a
          # revised original Requirement *before* any current Specification or
          # Architecture exists, without admitting fabricated Proof/Work.
          cp "$GITHUB_WORKSPACE/test/requirement-revision-packed-consumer.mjs" "$RUNNER_TEMP/consumer/"
          node requirement-revision-packed-consumer.mjs

          # Execute the newly corrected readout through the genuinely packed
          # clean consumer, not only through the source checkout's node_modules.
          node --input-type=module -e '
            import {specificationReadout,specificationRequirementsXml}
              from "@red-cup-engineering/specification-engineering-services-section/specification-readout";
            const authored=[
              "# Work acceptance",
              "The buyer MUST accept the delivered source.",
              "~~~md",
              "Example: RFC2119 RFC8174. Fake MUST NOT create Work.",
              "~~~not-a-closing-fence",
              "Still inert SHOULD NOT be normative.",
              "~~~",
            ].join("\n");
            const reading=specificationReadout(authored);
            if(reading.bcp14.requirements.length!==1
               ||reading.bcp14.requirements[0].keyword!=="MUST"
               ||reading.bcp14.requirements[0].line!==2
               ||reading.bcp14.rfc2119
               ||reading.bcp14.rfc8174) process.exit(2);
            const xml=specificationRequirementsXml(reading);
            if(!xml.includes("buyer MUST accept")
               ||xml.includes("Still inert SHOULD NOT")) process.exit(2);
          '
      - name: Retain unpromoted source artifact and checksum after all receiving
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: specification-design-qualified-source-${{ github.sha }}
          path: ${{ runner.temp }}/specification-candidate/
          if-no-files-found: error
          retention-days: 30

  # Signing is deliberately isolated from dependency installation and native
  # tests. Only the least-privileged read-only original job may build and run
  # source, and only its successful, exact-SHA artifact can reach this job.
  attest-qualified-candidate:
    needs: original-source-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Receive the exact original consumer-qualified npm archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: specification-design-qualified-source-${{ github.sha }}
          path: ${{ runner.temp }}/qualified-candidate/
      - name: Require a unique checksum-bound original package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qualified-candidate"
          shopt -s nullglob
          archives=( ./*.tgz )
          test "${#archives[@]}" -eq 1
          test -f SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 1
          sha256sum --check --strict SHA256SUMS
          test "$(sed -E 's/^[a-f0-9]{64}  //' SHA256SUMS)" = "${archives[0]#./}"
          tar -tzf "${archives[0]}" | grep -Fx 'package/src/engineering-design.mjs'
          tar -tzf "${archives[0]}" | grep -Fx 'package/LICENSE'
      - name: Sign source-qualified SLSA v1 provenance for the tested tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/qualified-candidate/*.tgz
      - name: Independently verify Sigstore certificate, original workflow, SHA and subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( "$RUNNER_TEMP"/qualified-candidate/*.tgz )
          test "${#archives[@]}" -eq 1
          gh attestation verify "${archives[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/specification-native-receiving.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/verified-provenance.json"
          node --input-type=module - "${archives[0]}" "$RUNNER_TEMP/verified-provenance.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const [, , tarball, verified] = process.argv;
          const digest = createHash('sha256').update(readFileSync(tarball)).digest('hex');
          const records = JSON.parse(readFileSync(verified, 'utf8'));
          assert.ok(Array.isArray(records) && records.length > 0);
          assert.ok(records.some(record => {
            const statement = record?.verificationResult?.statement;
            return statement?.predicateType === 'https://slsa.dev/provenance/v1' &&
              statement.subject?.some(subject => subject.digest?.sha256 === digest);
          }), 'a cryptographically verified SLSA statement must name these exact tested archive bytes');
          console.log('Independent Sigstore/SLSA verification: actual source-bound npm tarball received.');
          NODE
          cp "${archives[0]}" "$RUNNER_TEMP/tampered-candidate.tgz"
          printf 'x' >> "$RUNNER_TEMP/tampered-candidate.tgz"
          if gh attestation verify "$RUNNER_TEMP/tampered-candidate.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/specification-native-receiving.yml" \
            --source-digest "$GITHUB_SHA" > "$RUNNER_TEMP/unexpected-tamper-acceptance.txt" 2>&1; then
            echo "::error::Modified candidate passed provenance authentication"
            exit 1
          fi
          echo "Original passed; a one-byte changed candidate was refused by the independent verifier"
