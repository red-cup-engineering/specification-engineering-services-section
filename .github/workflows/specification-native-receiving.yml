name: Specification Engineering native source and package receiving

on:
  pull_request:
    paths:
      - ".github/workflows/specification-native-receiving.yml"
      - ".npmrc"
      - "package.json"
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "data/records/schema/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specification-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Resolve declared dependencies from original registry
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/
      - name: Run every original native Node test
        run: npm test
      - name: Read exact original pre-index source without reauthoring a benchmark provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/specification-engineering-services-section
          ref: 7ef4ddb74880d4d28a80996a87583471fedbc911
          path: baseline-original
          persist-credentials: false
      - name: Measure same-job original versus indexed native source and preserve refusals
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline-original rev-parse HEAD)" = "7ef4ddb74880d4d28a80996a87583471fedbc911"
          test "$(git hash-object baseline-original/src/architecture-description.mjs)" = "a0dbe86c7f42b7b3cf4ce4f9af533e2ac1fc188d"
          SPEC_ARCHITECTURE_BASELINE_MODULE="$GITHUB_WORKSPACE/baseline-original/src/architecture-description.mjs" \
            node --test test/architecture-description.test.mjs
      - name: Qualify packed source and both runtime schemas
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/specification-pack.json"
          tarball="$(node -e 'const p=require(process.argv[1]); if(p.length!==1 || typeof p[0]?.filename!=="string")process.exit(2); process.stdout.write(p[0].filename)' "$RUNNER_TEMP/specification-pack.json")"
          tar -tzf "$RUNNER_TEMP/$tarball" > "$RUNNER_TEMP/specification-members.txt"
          grep -Fx 'package/data/records/schema/specification.schema.json' "$RUNNER_TEMP/specification-members.txt"
          grep -Fx 'package/data/records/schema/architecture-description.schema.json' "$RUNNER_TEMP/specification-members.txt"
          grep -Fx 'package/scripts/read-source-json-stdin.mjs' "$RUNNER_TEMP/specification-members.txt"
          test "$(grep -Fc 'package/data/records/schema/' "$RUNNER_TEMP/specification-members.txt")" -ge 2
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/ "$RUNNER_TEMP/$tarball"
          node node_modules/@red-cup-engineering/specification-engineering-services-section/scripts/render-architecture-description.mjs --help >/dev/null
          node --input-type=module -e '
            import {loadArchitectureDescriptionSchema} from "@red-cup-engineering/specification-engineering-services-section/architecture-description";
            const schema=loadArchitectureDescriptionSchema();
            if(schema?.$schema!=="https://json-schema.org/draft/2020-12/schema"
               || schema?.title?.includes("NOT a 42010:2022 conformance certificate")!==true) process.exit(2);
          '

          # Execute the newly corrected readout through the genuinely packed
          # clean consumer, not only through the source checkout's node_modules.
          node --input-type=module -e '
            import {specificationReadout,specificationRequirementsXml}
              from "@red-cup-engineering/specification-engineering-services-section/specification-readout";
            const authored=[
              "# Work acceptance",
              "The buyer MUST accept the delivered source.",
              "~~~md",
              "Example: RFC2119 RFC8174. Fake MUST NOT create Work.",
              "~~~not-a-closing-fence",
              "Still inert SHOULD NOT be normative.",
              "~~~",
            ].join("\n");
            const reading=specificationReadout(authored);
            if(reading.bcp14.requirements.length!==1
               ||reading.bcp14.requirements[0].keyword!=="MUST"
               ||reading.bcp14.requirements[0].line!==2
               ||reading.bcp14.rfc2119
               ||reading.bcp14.rfc8174) process.exit(2);
            const xml=specificationRequirementsXml(reading);
            if(!xml.includes("buyer MUST accept")
               ||xml.includes("Still inert SHOULD NOT")) process.exit(2);
          '
